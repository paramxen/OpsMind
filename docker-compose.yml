version: '3.8'

services:
  mongodb:
    image: mongo:7.0-alpine
    container_name: opsmind-mongo
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: password
    ports:
      - "27017:27017"
    volumes:
      - mongodb-data:/data/db
      - mongodb-config:/data/configdb
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - opsmind-network

  redis:
    image: redis:7-alpine
    container_name: opsmind-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - opsmind-network

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: opsmind-app
    environment:
      NODE_ENV: development
      PORT: 4000
      MONGO_URI: mongodb://admin:password@mongodb:27017/opsmind
      MONGO_DB_NAME: opsmind
      REDIS_URL: redis://redis:6379
      OPENAI_API_KEY: ${OPENAI_API_KEY:-sk-test}
      JWT_SECRET: your-secret-key-min-32-characters-long
      JWT_EXPIRY: 15m
      REFRESH_TOKEN_EXPIRY: 7d
      LOG_LEVEL: debug
      CORS_ORIGIN: http://localhost:3000,http://localhost:3001
    ports:
      - "4000:4000"
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./storage:/app/storage
      - ./dist:/app/dist
    networks:
      - opsmind-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:4000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s

volumes:
  mongodb-data:
  mongodb-config:
  redis-data:

networks:
  opsmind-network:
    driver: bridge
